name: Reusable esp32c6-at workflow template

on:
  workflow_call:
    # parameters from upstream workflow
    inputs:
      module_name:
        required: true
        type: string
      artifacts_name:
        required: true
        type: string
      enable_at_debug:
        required: false
        type: boolean
    # parameters inherited from upstream (reserved for potential future custom project needs)
    secrets:
      ESP32C6_4MB_TOKEN:
        required: false

jobs:
  build-template-esp32c6:
    runs-on: ubuntu-latest
    env:
      PLATFORM: PLATFORM_ESP32C6
      MODULE_NAME: ${{ inputs.module_name }}
      SILENCE: 0
    steps:
    - uses: actions/checkout@v6.0.2
    - uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.10'
    - name: Set up environment variables
      run: |
        source .github/workflows/utils.sh && setup_env_variables
    - name: Enable AT debug log
      if: ${{ inputs.enable_at_debug == true }}
      run: |
        source .github/workflows/utils.sh && enable_at_debug
    - name: Enlarge app partition size
      if: ${{ inputs.enable_at_debug == true }}
      run: |
        source .github/workflows/utils.sh && enlarge_app_partition
    - name: Disable official OTA support
      run: |
        source .github/workflows/utils.sh && disable_official_ota_cmd
    - name: Check LINK GPIO host state machine
      # Build the same production state machine on the runner before the target build.
      run: |
        gcc -std=c11 -Wall -Wextra -Werror -I main tests/link_gpio_host_test.c main/link_gpio_state.c -o /tmp/link_gpio_host_test
        /tmp/link_gpio_host_test
    - name: Install ESP compilation environment
      run: |
        ./build.py install
    - name: Compile
      run: |
        ./build.py build
    - name: Post process
      run: |
        grep -qx 'CONFIG_RTC_CLK_SRC_EXT_OSC=y' sdkconfig
        grep -qx '# CONFIG_RTC_CLK_SRC_EXT_CRYS is not set' sdkconfig
        grep -q '__wrap_nimble_port_init' build/*.map
        grep -q '__wrap_nimble_port_deinit' build/*.map
        strings build/*.elf | grep -F '+LINKGPIO'
        strings build/*.elf | grep -F '+RTCCLK'
        grep -E 'RTC_CLK_SRC|ESP_SYSTEM_RTC_EXT|RTC_CLK_CAL_CYCLES' sdkconfig
        cp .github/workflows/NOTES.txt NOTES.txt
    - name: Upload artifacts
      uses: actions/upload-artifact@v7.0.0
      with:
        name: ${{ inputs.artifacts_name }}
        path: |
          sdkconfig
          build/*.bin
          build/*.elf
          build/*.map
          build/bootloader/*.bin
          build/partition_table/*.bin
          build/customized_partitions/*
          build/flasher_args.json
          build/project_description.json
          build/download.config
          build/factory/*
          NOTES.txt
